<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quilt — Live Cell Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0d0f12;
      --fg: #e6e6e6;
      --dim: #888;
      --accent: #4ea1ff;
      --ok: #4ade80;
      --warn: #facc15;
      --err: #ef4444;
      --hover: #1a1d22;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin: 0;
      padding: 1rem;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--accent);
      margin: 0 0 1rem 0;
    }
    .sheet {
      max-width: 1100px;
      margin: 0 auto;
    }
    .cell {
      display: grid;
      grid-template-columns: 220px 100px 1fr 80px;
      align-items: center;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover { background: var(--hover); }
    .cell .id { color: var(--fg); }
    .cell .kind {
      color: var(--dim);
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .cell.kind-value .kind { color: #4ea1ff; }
    .cell.kind-formula .kind { color: #4ade80; }
    .cell.kind-program .kind { color: #c084fc; }
    .cell.kind-sensor .kind { color: #67e8f9; }
    .cell.kind-router .kind { color: #c084fc; }
    .cell.kind-listener .kind { color: #f87171; }
    .cell .value {
      font-family: inherit;
      color: var(--fg);
      word-break: break-all;
    }
    .cell .status {
      font-size: 0.75rem;
      text-align: right;
      text-transform: uppercase;
    }
    .cell .status.ready { color: var(--ok); }
    .cell .status.stale { color: var(--warn); }
    .cell .status.error { color: var(--err); }
    .cell .status.idle { color: var(--dim); }
    .cell .status.computing { color: var(--accent); }
    .error {
      color: var(--err);
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem 0.2rem 320px;
    }
    .editable {
      background: transparent;
      border: 1px solid var(--dim);
      color: var(--fg);
      font-family: inherit;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      width: 100%;
    }
    .editable:focus {
      outline: none;
      border-color: var(--accent);
    }
    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ok);
      margin-left: 0.5rem;
      animation: pulse 1.5s infinite;
    }
    .live-dot.disconnected { background: var(--err); animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <h1 id="title">Quilt — Live Cell Sheet <span class="live-dot" id="live-dot" title="Connected to server-sent events"></span></h1>
    <div id="cells"></div>
  </div>
  <script type="module" src="./quilt.js"></script>
</body>
</html>
