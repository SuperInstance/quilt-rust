[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/mcp",
    "packages/cli",
    "packages/tui",
    "packages/web",
    "crates/quilt-cabi",
    "crates/quilt-core-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The Quilt Authors"]
repository = "https://github.com/superinstance/quilt-rust"
description = "A spreadsheet where every cell is a live, addressable capability. The grid is the runtime."

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP for API cells
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Expression evaluation
rhai = { version = "1.20", features = ["sync", "serde"] }

# MCP server
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Misc
regex = "1.10"
once_cell = "1.19"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = { version = "2", features = ["serde"] }
crossbeam-channel = "0.5"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
