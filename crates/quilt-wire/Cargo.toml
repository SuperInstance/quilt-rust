[package]
name = "quilt-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "QuiltWire v0 link-core: 16-byte transport-blind frame, walks/2 arrival stamping peer, pty loopback proof."

[features]
default = ["std"]
# `std` gates the desktop peer + walks/2 JSONL writer. The frame codec, CRC,
# TLV parser, and seq tracker are no_std-compatible with no alloc; the core
# paths below compile unchanged for embedded targets (xtensa, thumb).
std = ["dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true, default-features = false }

[dev-dependencies]
# pty loopback integration test (tests/pty_loopback.rs) — unix only usage in tests
libc = "0.2"

[[bin]]
name = "quilt-wire-peer"
required-features = ["std"]
